name: Main

permissions:
  contents: read

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8,20 * * *"

jobs:
  unit-tests:
    name: Unit tests
    uses: apple/swift-nio/.github/workflows/unit_tests.yml@main
    with:
      # `Package.swift` requires Swift 6.2, so the older matrix entries cannot build this
      # package and are not configured here.
      linux_6_2_arguments_override: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error"
      linux_6_3_arguments_override: "-Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error"
      linux_nightly_main_arguments_override: "--explicit-target-dependency-import-check error"

  cxx-interop:
    name: Cxx interop
    uses: apple/swift-nio/.github/workflows/cxx_interop.yml@main

  android-sdk:
    name: Android Swift SDK
    uses: apple/swift-nio/.github/workflows/android_swift_sdk.yml@main
    with:
      # swift-collections 1.6.0 uses `@inline(always)` under `#if compiler(>=6.3)`, but the
      # attribute is still gated behind the experimental `InlineAlways` feature in the nightly
      # `main` toolchain this job builds with. Enable it until the dependency's guard is fixed
      # upstream (cf. apple/swift-collections #580/#584).
      additional_command_arguments: "-Xswiftc -enable-experimental-feature -Xswiftc InlineAlways"

  examples:
    name: Build examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PerformanceTester is not here: it requires Swift 6.3 or later and has its own job below.
        example: [IMAPTool, CLI, Proxy, Fuzzer]
    container:
      image: swift:6.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build --package-path "Examples/${{ matrix.example }}"
      - name: Test
        if: matrix.example == 'CLI' || matrix.example == 'IMAPTool'
        run: swift test --package-path "Examples/${{ matrix.example }}"

  benchmarks:
    name: Build benchmarks
    runs-on: ubuntu-latest
    container:
      # See the matching comment in pull_request.yml: the benchmark package requires Swift 6.3 or
      # later, where ordo-one/benchmark needs no jemalloc.
      image: swift:6.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: swift build --package-path Examples/PerformanceTester
